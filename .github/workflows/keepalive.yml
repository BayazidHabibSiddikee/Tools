# ============================================================
# Keepalive — prevents Render.com and Koyeb.com from sleeping
# ============================================================
# Render free tier spins down after 15 min of inactivity.
# Koyeb free tier also sleeps after inactivity.
# This workflow pings both /health endpoints every 10 minutes.
#
# Setup (GitHub repo → Settings → Secrets → Actions):
#   RENDER_URL  = https://your-app.onrender.com
#   KOYEB_URL   = https://your-app.koyeb.app
#
# Both secrets are optional — if unset, that ping step is skipped.
# ============================================================

name: 🏓 Dual-Cloud Keepalive (Render + Koyeb)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:           # manual trigger

jobs:
  keepalive:
    name: Ping health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Render gateway
        if: ${{ secrets.RENDER_URL != '' }}
        run: |
          URL="${{ secrets.RENDER_URL }}/api/health"
          echo "→ Render: $URL"
          RESP=$(curl -sf --max-time 20 "$URL" || echo '{"ok":false}')
          echo "   $RESP"
          echo "$RESP" | grep -q '"ok":true' || echo "⚠️  Render not healthy (may be warming up)"

      - name: Ping Koyeb worker
        if: ${{ secrets.KOYEB_URL != '' }}
        run: |
          URL="${{ secrets.KOYEB_URL }}/health"
          echo "→ Koyeb: $URL"
          RESP=$(curl -sf --max-time 20 "$URL" || echo '{"ok":false}')
          echo "   $RESP"
          echo "$RESP" | grep -q '"ok":true' || echo "⚠️  Koyeb not healthy (may be warming up)"

      # Legacy HuggingFace Space ping (kept for backward compat)
      - name: Ping HuggingFace Space (optional)
        if: ${{ secrets.HF_SPACE_URL != '' }}
        run: |
          URL="${{ secrets.HF_SPACE_URL }}/api/health"
          echo "→ HF Space: $URL"
          curl -sf --max-time 20 "$URL" || echo "⚠️  HF Space not reachable"

      - name: Done
        run: echo "✅ Keepalive completed at $(date -u)"
