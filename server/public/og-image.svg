    <text x="90" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle">100% Free</text>
    
    <rect x="200" y="0" width="220" height="50" rx="25" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="310" y="32" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle">Zero File Tracking</text>
    
    <rect x="440" y="0" width="240" height="50" rx="25" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="560" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle">35+ Instant Tools</text>
