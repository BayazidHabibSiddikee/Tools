<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="450" r="220" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  
  <!-- Spark Icon -->
  <g transform="translate(100, 120)">
    <rect width="96" height="96" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M48 20 L55 38 L73 45 L55 52 L48 70 L41 52 L23 45 L41 38 Z" fill="url(#accent)" />
  </g>
  
  <text x="220" y="185" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="-1">Toolforge</text>
  
  <text x="100" y="320" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48">All-In-One Free Online Python Tools</text>
  <text x="100" y="390" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="28">
    Word &amp; PDF Converters • Financial Tickers • QR Codes • Media Transcripts • In-Memory &amp; Private
  </text>

  <!-- Tag Pills -->
  <g transform="translate(100, 480)">
